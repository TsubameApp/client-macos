name: Sync TsubameCore package

on:
  repository_dispatch:
    types: [core-updated]

permissions:
  contents: write

concurrency:
  group: sync-tsubame-core-package
  cancel-in-progress: false

jobs:
  sync:
    runs-on: xcode-27
    steps:
      - name: Validate dispatch source
        env:
          AUTOMATION_TOKEN: ${{ secrets.TSUBAME_AUTOMATION_TOKEN }}
          SOURCE_REPOSITORY: ${{ github.event.client_payload.repository }}
          SOURCE_SHA: ${{ github.event.client_payload.sha }}
        run: |
          set -euo pipefail

          if [[ -z "${AUTOMATION_TOKEN:-}" ]]; then
            echo "TSUBAME_AUTOMATION_TOKEN is not configured." >&2
            exit 1
          fi

          if [[ "${SOURCE_REPOSITORY}" != "TsubameApp/Core" ]]; then
            echo "Unsupported Core dispatch source: ${SOURCE_REPOSITORY}" >&2
            exit 1
          fi

          if [[ ! "${SOURCE_SHA}" =~ ^[0-9a-f]{40,64}$ ]]; then
            echo "Invalid Core commit: ${SOURCE_SHA}" >&2
            exit 1
          fi

      - name: Check out macOS client
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select current Core revision
        id: core
        env:
          REQUESTED_SHA: ${{ github.event.client_payload.sha }}
        run: |
          set -euo pipefail

          remote_sha="$(git ls-remote https://github.com/TsubameApp/Core.git refs/heads/main | cut -f1)"

          if [[ ! "${remote_sha}" =~ ^[0-9a-f]{40,64}$ ]]; then
            echo "Could not resolve the current TsubameApp/Core main commit." >&2
            exit 1
          fi

          if [[ "${remote_sha}" != "${REQUESTED_SHA}" ]]; then
            echo "A newer Core main exists; using ${remote_sha} instead of ${REQUESTED_SHA}."
          fi

          echo "sha=${remote_sha}" >> "${GITHUB_OUTPUT}"

      - name: Update Xcode package requirement
        env:
          CORE_SHA: ${{ steps.core.outputs.sha }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import pathlib
          import re

          path = pathlib.Path("Tsubame.xcodeproj/project.pbxproj")
          text = path.read_text()
          pattern = re.compile(
              r'(repositoryURL = "https://github\.com/TsubameApp/Core\.git";'
              r'\s*requirement = \{\s*)'
              r'kind = revision;\s*revision = [0-9a-f]{40,64};'
              r'(\s*\};)'
          )
          updated, count = pattern.subn(
              lambda match: match.group(1)
              + "kind = revision;\n\t\t\t\trevision = "
              + os.environ["CORE_SHA"]
              + ";"
              + match.group(2),
              text,
          )
          if count != 1:
              raise SystemExit(f"Expected one pinned Core requirement, found {count}")
          if updated != text:
              path.write_text(updated)
          PY

      - name: Resolve package dependencies
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project Tsubame.xcodeproj \
            -scheme Tsubame

      - name: Validate and stage Core pin
        id: update
        env:
          CORE_SHA: ${{ steps.core.outputs.sha }}
        run: |
          set -euo pipefail

          package_resolved="Tsubame.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"

          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re

          project = pathlib.Path("Tsubame.xcodeproj/project.pbxproj").read_text()
          matches = re.findall(
              r'repositoryURL = "https://github\.com/TsubameApp/Core\.git";'
              r'\s*requirement = \{\s*kind = revision;'
              r'\s*revision = ([0-9a-f]{40,64});\s*\};',
              project,
          )
          if matches != [os.environ["CORE_SHA"]]:
              raise SystemExit(f"Core requirement mismatch: {matches}")

          resolved = json.loads(pathlib.Path(
              "Tsubame.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"
          ).read_text())
          pins = [pin for pin in resolved["pins"] if pin["identity"] == "core"]
          if len(pins) != 1 or pins[0]["location"] != "https://github.com/TsubameApp/Core.git":
              raise SystemExit("Expected exactly one remote Core pin")
          if pins[0]["state"] != {"revision": os.environ["CORE_SHA"]}:
              raise SystemExit(f"Core resolved state mismatch: {pins[0]['state']}")
          PY

          git add Tsubame.xcodeproj/project.pbxproj "${package_resolved}"
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "Core is already pinned to ${CORE_SHA}."
            exit 0
          fi

          echo "changed=true" >> "${GITHUB_OUTPUT}"
          echo "core_sha=${CORE_SHA}" >> "${GITHUB_OUTPUT}"
          git diff --cached

      - name: Commit and push resolved Core revision
        if: steps.update.outputs.changed == 'true'
        env:
          CORE_SHA: ${{ steps.update.outputs.core_sha }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit \
            -m "build: bump TsubameCore package" \
            -m "Core main: ${CORE_SHA}."
          git push origin HEAD:main

      - name: Notify umbrella after Core synchronization
        env:
          GH_TOKEN: ${{ secrets.TSUBAME_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail

          source_sha="$(git rev-parse HEAD)"
          gh api \
            --method POST \
            repos/TsubameApp/Tsubame/dispatches \
            -f event_type=submodule-updated \
            -f "client_payload[repository]=TsubameApp/client-macos" \
            -f "client_payload[component]=macOS" \
            -f "client_payload[sha]=${source_sha}"
